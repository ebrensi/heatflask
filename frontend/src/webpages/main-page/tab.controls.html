<!-- Controls Tab -->

<h4>System Constants</h4>

<div class="dial-grid">
  <div class="dial">
    <span id="speedConst"></span>
    <div class="dial-name">Timescale <i>&tau;</i></div>
    <div class="dial-value" id="tauValue">&mdash;</div>
  </div>

  <div class="dial">
    <span id="sepConst"></span>
    <div class="dial-name">Period <i>T</i></div>
    <div class="dial-value" id="TValue">&mdash;</div>
  </div>

  <div class="dial">
    <span id="sizeConst"></span>
    <div class="dial-name">Dot size</div>
    <div class="dial-value" id="szValue">&mdash;</div>
  </div>
</div>

<div class="dot-const-info" id="cycleInfo"></div>

<hr />
<span>
  <input
    type="checkbox"
    id="showPaths"
    data-bind="paths"
    data-prop="checked"
    data-class="visual"
  />
  <label for="showPaths">Show Paths</label>
</span>
<br /><br />
<span>
  <input
    type="checkbox"
    id="showShadows"
    data-bind="shadows"
    data-prop="checked"
    data-class="visual"
  />
  <label for="showShadows">Shadows (CPU intensive)</label>
</span>
