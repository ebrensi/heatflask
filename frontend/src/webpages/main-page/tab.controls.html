<!-- Controls Tab -->

<h4>Model Parameters</h4>

<div class="dial-stack">
  <div class="dial">
    <span id="speedConst" class="dial-knob"></span>
    <div class="dial-text">
      <div class="dial-name">Timescale <i>&tau;</i></div>
      <div class="dial-value" id="tauValue">&mdash;</div>
      <div class="dial-hint">playback speed</div>
    </div>
  </div>

  <div class="dial">
    <span id="sepConst" class="dial-knob"></span>
    <div class="dial-text">
      <div class="dial-name">Period <i>T</i></div>
      <!-- T beside the real time one loop of it takes: T/tau, which moves
           with this dial and with the timescale dial above -->
      <div class="dial-value dial-pair" title="T ~ T/&tau;">
        <span id="TValue">&mdash;</span>
        <span class="dial-rel">~</span>
        <span class="dial-alt" id="cycleValue">&mdash;</span>
      </div>
      <div class="dial-hint">activity ~ model</div>
    </div>
  </div>

  <div class="dial">
    <span id="sizeConst" class="dial-knob"></span>
    <div class="dial-text">
      <div class="dial-name">Dot size</div>
      <div class="dial-value" id="szValue">&mdash;</div>
    </div>
  </div>

  <div class="dial">
    <span id="widthConst" class="dial-knob"></span>
    <div class="dial-text">
      <div class="dial-name">Path width</div>
      <div class="dial-value" id="pwValue">&mdash;</div>
      <div class="dial-hint">zero hides the paths</div>
    </div>
  </div>
</div>
