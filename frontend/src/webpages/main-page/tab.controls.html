<!-- Controls Tab -->

<h4>System Constants</h4>

<div class="dial-stack">
  <div class="dial">
    <span id="speedConst" class="dial-knob"></span>
    <div class="dial-text">
      <div class="dial-name">Timescale <i>&tau;</i></div>
      <div class="dial-value" id="tauValue">&mdash;</div>
      <div class="dial-hint">playback speed</div>
    </div>
  </div>

  <div class="dial">
    <span id="sepConst" class="dial-knob"></span>
    <div class="dial-text">
      <div class="dial-name">Period <i>T</i></div>
      <div class="dial-value" id="TValue">&mdash;</div>
      <div class="dial-hint">activity time between dots</div>
    </div>
  </div>

  <div class="dial">
    <span id="sizeConst" class="dial-knob"></span>
    <div class="dial-text">
      <div class="dial-name">Dot size</div>
      <div class="dial-value" id="szValue">&mdash;</div>
    </div>
  </div>
</div>

<div class="dot-const-info" id="cycleInfo"></div>

<hr />
<span>
  <input
    type="checkbox"
    id="showPaths"
    data-bind="paths"
    data-prop="checked"
    data-class="visual"
  />
  <label for="showPaths">Show Paths</label>
</span>
