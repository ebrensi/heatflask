<!-- Main Query tab -->

<h3 data-i18n="tab.query.heading">Activities Query:</h3>

<span data-qshow="days,activities">
  <input
    id="quantity"
    type="number"
    value="0"
    min="1"
    max="9999"
    data-bind="query.quantity:value"
  />
</span>

<select id="queryType" data-bind="query.type:value">
  <option value="days" data-i18n="tab.query.optDays">recent days</option>
  <option value="activities" selected data-i18n="tab.query.optActivities">
    recent activities
  </option>
  <option value="ids" data-i18n="tab.query.optIds">Activity IDs</option>
  <option value="dates" data-i18n="tab.query.optDates">Date-Range</option>
  <option value="key" data-i18n="tab.query.optKey">Key</option>
</select>

<br />

<div data-qshow="key">
  <input type="text" value="" data-bind="query.key:value" />
</div>

<div data-qshow="ids">
  <textarea
    autocomplete="on"
    data-i18n-placeholder="tab.query.idsPlaceholder"
    placeholder="enter activity ids here"
    spellcheck="false"
    data-bind="query.ids:value"
  >
  </textarea>
</div>

<div data-qshow="dates">
  <span data-i18n="tab.query.after">After:</span>
  <input type="date" id="date-after" data-bind="query.after:value" />
  <br />
  <span data-i18n="tab.query.before">Before:</span>
  <input type="date" id="date-before" data-bind="query.before:value" />
</div>

<br />

<label>
  <input type="checkbox" id="autozoom" data-bind="visual.autozoom:checked" />
  <span data-i18n="tab.query.autozoom">
    Auto-Zoom <i class="hf hf-bullseye"></i> to query after import
  </span>
</label>

<br />
<div class="info-message"></div>

<br />

<!-- display only while not importing -->
<button
  id="button:query"
  type="button"
  data-mshow="!importing"
  class="btn btn-a btn-sm smooth"
  data-i18n="tab.query.queryButton"
>
  <i class="hf hf-cloud-download"></i>
  Query
</button>
<!-- ------------------------------- -->

<div data-fshow="importing">
  <!-- display only while importing  -->
  <div class="import-progress">
    <div class="progress msgbox"></div>
    <progress class="progbar"></progress>
  </div>
  <br />
  <button
    type="button"
    class="btn btn-c btn-sm smooth"
    id="button:abort"
    data-i18n="tab.query.abortImport"
  >
    <i class="hf hf-cancel-circle"></i>
    Abort Import
  </button>
</div>

<br />

<!-- Displayed only if current-user id is not set (not logged-in) -->
<div data-fshow="!authenticated">
  <span data-i18n="tab.query.createAccount"
    >Create an account and/or log in.</span
  ><br />
  <button class="strava-auth" id="button:login"></button>
</div>

<hr />

<h3 data-i18n="tab.query.languageHeading">Language</h3>

<!-- Options are built in tab.query.ts from the catalogs that exist, named in
     their own language, so adding a catalog adds its option. -->
<select id="language-select"></select>

<p id="translate-note" data-i18n="tab.query.translateNote">
  <a id="translate-link" target="_blank" rel="noopener"
    >Help us fix or add new translations!</a
  >
</p>

<h3 data-i18n="tab.query.unitsHeading">Units</h3>

<select id="units-select">
  <option value="" data-i18n="tab.query.unitsAuto">Automatic</option>
  <option value="metric" data-i18n="tab.query.unitsMetric">
    Metric (km, m)
  </option>
  <option value="imperial" data-i18n="tab.query.unitsImperial">
    Imperial (mi, ft)
  </option>
</select>

<h3 data-i18n="tab.query.textSizeHeading">Text size</h3>

<!-- A- and A+ are the same in every language; the labels beside them are not,
     so they carry the translated titles. -->
<div class="text-size">
  <button
    type="button"
    id="text-smaller"
    data-i18n-title="tab.query.textSmaller"
    title="Smaller"
  >
    A&minus;
  </button>
  <button type="button" id="text-reset" data-i18n="tab.query.textReset">
    Normal
  </button>
  <button
    type="button"
    id="text-larger"
    data-i18n-title="tab.query.textLarger"
    title="Larger"
  >
    A+
  </button>
</div>
