<!-- Main Query tab -->

<h3 data-i18n="tab.query.heading">Activities Query:</h3>

<!-- Which of the fields below shows depends on the query type; tab.query.ts
     unhides the ones that type uses -->
<span id="quantity-box" hidden>
  <input id="quantity" type="number" value="0" min="1" max="9999" />
</span>

<select id="queryType">
  <option value="days" data-i18n="tab.query.optDays">recent days</option>
  <option value="activities" selected data-i18n="tab.query.optActivities">
    recent activities
  </option>
  <option value="ids" data-i18n="tab.query.optIds">Activity IDs</option>
  <option value="dates" data-i18n="tab.query.optDates">Date-Range</option>
  <option value="key" data-i18n="tab.query.optKey">Key</option>
</select>

<br />

<div id="key-box" hidden>
  <input type="text" id="query-key" value="" />
</div>

<div id="ids-box" hidden>
  <textarea
    id="query-ids"
    autocomplete="on"
    data-i18n-placeholder="tab.query.idsPlaceholder"
    placeholder="enter activity ids here"
    spellcheck="false"
  >
  </textarea>
</div>

<div id="dates-box" hidden>
  <span data-i18n="tab.query.after">After:</span>
  <input type="date" id="date-after" />
  <br />
  <span data-i18n="tab.query.before">Before:</span>
  <input type="date" id="date-before" />
</div>

<br />

<label>
  <input type="checkbox" id="autozoom" />
  <span data-i18n="tab.query.autozoom">
    Auto-Zoom <i class="hf hf-bullseye"></i> to query after import
  </span>
</label>

<br />
<div class="info-message"></div>

<br />

<button
  id="query-run"
  type="button"
  class="btn btn-a btn-sm smooth"
  data-i18n="tab.query.queryButton"
>
  <i class="hf hf-cloud-download"></i>
  Query
</button>

<br />
<br />

<!-- Only for a visitor who is not logged in -->
<div id="query-login" hidden>
  <span data-i18n="tab.query.createAccount"
    >Create an account and/or log in.</span
  ><br />
  <button class="strava-auth" id="query-login-button"></button>
</div>

<br />
