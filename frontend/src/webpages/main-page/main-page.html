<!DOCTYPE html>
<html>
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="robots" content="noindex" />

    <title>${APP_NAME}</title>

    <link rel="shortcut icon" href="~/src/images/favicon.ico" />
    <!-- Makes the site installable ("Add to Home Screen"); on every page, so
         that any of them can be the one it is installed from -->
    <link
      rel="apple-touch-icon"
      href="~/src/images/app-icons/apple-touch-icon.png"
    />
    <link rel="manifest" href="../app.webmanifest" />
    <meta name="theme-color" content="#1b1b1b" />
    <link rel="stylesheet" href="./main-page.css" />
  </head>

  <body>
    <div class="msg" id="flashes">${flashes}</div>
    <div id="sidebar" class="sidebar collapsed">
      <!-- Nav tabs -->
      <div class="sidebar-tabs"><ul role="tablist"></ul></div>

      <!-- Tab panes -->
      <div class="sidebar-content"></div>
    </div>

    <div id="map" class="sidebar-map"></div>
  </body>

  <!-- Data passed from the backend at serve-time will be here -->
  <div id="runtime_json">${runtime_json}</div>
  <script src="./main-page.ts" type="module"></script>
</html>
