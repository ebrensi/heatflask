<!-- Activity List/Table Tab -->
<div class="items-controls">
  <button
    type="button"
    class="btn btn-b btn-sm"
    data-action="selection-clear"
    data-i18n="tab.activities.clearSelection"
  >
    Clear Selection
  </button>

  <button
    type="button"
    class="btn btn-a btn-sm"
    data-action="selection-render"
    data-i18n="tab.activities.renderSelected"
  >
    Render selected
  </button>

  <br /><br />

  <input
    type="checkbox"
    data-bind="zoomToSelection"
    data-prop="checked"
    data-class="flag"
  />
  <!-- The icons live in the string with the words: a translation decides
       where in the phrase they fall. The checkbox stays outside it, since
       replacing that would drop its binding. -->
  <span data-i18n="tab.activities.zoomToSelection">
    <i class="fas fa-search-plus"></i> <i class="far fa-object-group"></i>
    <i class="fas fa-search-minus"></i> Zoom to selection
  </span>
</div>

<div id="items-container">
  <table id="items"></table>
</div>
