<!-- Profile & User Settings Tab -->

<!-- Shown instead to a visitor who is not logged in: someone viewing a shared
     map can browse it, but has no account to manage -->
<div id="profile-anon" hidden>
  <p class="profile-note">
    Log in with Strava to see your own activities, and to manage your
    Heatflask account.
  </p>
  <a id="profile-login-link" class="btn btn-a btn-sm" href="#">Log in with Strava</a>
</div>

<div id="profile-authed" hidden>
<div class="profile-head">
  <a
    id="profile-strava-link"
    href="https://www.strava.com/settings/profile"
    target="_blank"
    rel="noopener"
    title="Edit your profile on Strava"
  >
    <img id="profile-avatar" class="profile-avatar" alt="" />
  </a>
  <h3 id="profile-name">&nbsp;</h3>
</div>

<p class="profile-note">We index your activity summaries for fast access.</p>

<button type="button" class="btn btn-a btn-sm" data-action="view-index">
  View index
</button>

<hr />

<div>
  <label>
    <input type="checkbox" id="profile-public" />
    Public profile
  </label>
  <div class="profile-note">
    Public profiles are listed in the
    <a id="profile-directory-link" href="#" target="_blank" rel="noopener"
      >public user directory</a
    >, so other people can find and browse your map.
  </div>
</div>

<div id="profile-admin" hidden>
  <hr />
  <a id="profile-admin-link" href="#" target="_blank" rel="noopener"
    >User directory (admin)</a
  >
</div>

<hr />

<button type="button" data-action="logout" class="btn btn-c btn-sm">
  Log Out
</button>

<br /><br />

<button type="button" data-action="delete" class="btn btn-c btn-sm">
  Delete Account
</button>
</div>
