<!DOCTYPE html>

<html>
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no"
    />

    <!-- The descriptive half of the title is added by the script, so that the
         app name the backend substitutes here stays out of the catalog and a
         translation can put the two in whatever order reads right. -->
    <title>${app_name}</title>

    <link rel="shortcut icon" href="~/src/images/favicon.ico" />
    <link
      rel="apple-touch-icon"
      href="~/src/images/app-icons/apple-touch-icon.png"
    />
    <link rel="manifest" href="../app.webmanifest" />
    <meta name="theme-color" content="#1b1b1b" />
    <link rel="stylesheet" href="./splash-page.css" />
  </head>
  <body>
    <div id="bubbler" class="container">
      <div class="msg" id="flashes">${flashes}</div>

      <img class="logo" src="~/src/images/logo.png" />
      <h2 data-i18n="splash.tagline">
        Motion Mapping for Your Strava&nbsp;Data
      </h2>

      <br />

      <div class="splash">
        <input
          class="action btn btn-a"
          id="demo"
          type="submit"
          data-i18n-value="splash.demo"
          value="Demo"
        />
      </div>

      <br />
      <div class="splash">
        <button class="strava-auth" id="authorize"></button>
      </div>
    </div>
  </body>

  <!-- Data passed from the backend at serve-time will be here -->
  <div id="runtime_json">${runtime_json}</div>
  <script src="./splash-page.ts" type="module"></script>
</html>
