#
# The backend's dependencies and tooling, in one file instead of the four it
# used to take (requirements.txt, .flake8, .black-format, pytest.ini).
#
# Development tools are deliberately absent: they come from the Nix dev shell
# (see /flake.nix), which is the development environment. Only the runtime
# dependencies below are pip-installed, into a venv that mirrors what the
# Dockerfile builds -- and both install requirements.lock, which heatflask-lock
# generates from this file. Nothing installs from here directly.

[project]
name = "heatflask"
# dynamic, and there is no build backend to resolve it, which is deliberate:
# PEP 621 requires a version here, Heatflask's version lives in /VERSION and
# means something specific (see docs/VERSIONING.md), and a second copy would
# only drift. Declaring it dynamic satisfies the spec without inventing one.
# uv reads the dependencies below regardless.
dynamic = ["version"]
requires-python = ">=3.13"

dependencies = [
  "python-dateutil~=2.9.0",

  "sanic~=25.12.0",
  "sanic-ext~=25.12.0",
  "numpy~=2.5.0",

  # pymongo 4.13+ ships the async driver natively, replacing motor,
  # which was deprecated 2026-05-14 (critical fixes only until 2027-05-14).
  # Not pymongo[srv]: 4.18 has no such extra (uv warns about it) because
  # dnspython, which mongodb+srv:// URLs need, is now a base dependency.
  "pymongo~=4.18.0",

  "aiohttp[speedups]~=3.14.0",

  "msgpack~=1.2.0",
  "polyline~=2.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = [".venv"]

[tool.ruff.lint]
# Flake8 parity, on purpose. This is what the old .flake8 selected, so
# switching formatters changed no verdicts. Ruff's own default rule set flags
# about 150 more things in this codebase; adopting any of them is a separate
# decision, to be made when there is an appetite for it, rather than a side
# effect of replacing Black.
#
# One verdict did change: E203 (whitespace before ':') is gone, because it
# contradicts what the formatter does with slices. Flake8 needed it silenced
# too; Ruff simply does not offer it outside preview.
select = ["E", "W", "F"]

[tool.ruff.format]
# Ruff's formatter is a drop-in for Black, and on this codebase the output is
# identical in all 40 files. Defaults are Black's defaults.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.13"
# Sanic, pymongo and polyline ship types unevenly, and this is not wired into
# the hook or CI -- it is here so `python -m mypy heatflask` is usable at all.
ignore_missing_imports = true
